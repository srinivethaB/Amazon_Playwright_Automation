[pytest]
addopts =
    -v
    --headed
    --slowmo 300
    --video on
    --screenshot on
    --tracing retain-on-failure
    --output test-results
    --html=report.html
    --self-contained-html
testpaths = tests
markers =
    happy_path: main end-to-end flow
    negative: negative test cases
    edge: edge test cases
